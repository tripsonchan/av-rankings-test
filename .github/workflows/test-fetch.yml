name: Test fetch rankings (one-off)

# Manual trigger ONLY. No schedule: this is a one-off test, not a recurring job.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Install Scrapling + Camoufox browser
        run: |
          python -m pip install --upgrade pip
          pip install scrapling
          python -m camoufox fetch --browserforge
      - name: Fetch the 6 ranking pages (headed under Xvfb, read-only)
        run: xvfb-run -a python fetch.py
      - name: Upload result log
        uses: actions/upload-artifact@v4
        with:
          name: fetch-result
          path: fetch-result.json
          retention-days: 7
